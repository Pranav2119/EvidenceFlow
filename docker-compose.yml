services:
  postgres:
    image: postgres:16-alpine
    container_name: evidenceflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evidenceflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evidenceflow_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-evidenceflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evidenceflow} -d ${POSTGRES_DB:-evidenceflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evidenceflow-net

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: evidenceflow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evidenceflow-net

  neo4j:
    image: neo4j:5.26.0-community
    container_name: evidenceflow-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-evidenceflow_graph_secret}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - evidenceflow-net

volumes:
  postgres_data:
    name: evidenceflow_postgres_data
  qdrant_data:
    name: evidenceflow_qdrant_data
  neo4j_data:
    name: evidenceflow_neo4j_data

networks:
  evidenceflow-net:
    name: evidenceflow-network
    driver: bridge
