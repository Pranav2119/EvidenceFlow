name: EvidenceFlow AI - CI Quality & Regression Gate

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Test Suite & Metric Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      EMBEDDING_PROVIDER: fastembed
      GEMINI_API_KEY: ""
      FASTEMBED_CACHE_PATH: .fastembed-cache
      HF_HUB_OFFLINE: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: evidenceflow_db
      POSTGRES_USER: evidenceflow
      POSTGRES_PASSWORD: evidenceflow_dev_secret
      POSTGRES_APP_USER: evidenceflow_app
      POSTGRES_APP_PASSWORD: evidenceflow_app_secret
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: evidenceflow_dev_secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evidenceflow_db
          POSTGRES_USER: evidenceflow
          POSTGRES_PASSWORD: evidenceflow_dev_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceflow -d evidenceflow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.26.0-community
        env:
          NEO4J_AUTH: neo4j/evidenceflow_dev_secret
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p evidenceflow_dev_secret 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run PostgreSQL migrations
        run: uv run --frozen python -m evidenceflow.storage.migrate_postgres

      - name: Restore embedding model cache
        id: fastembed-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-${{ runner.os }}-${{ hashFiles('uv.lock', 'src/evidenceflow/storage/embeddings.py') }}

      - name: Prepare embedding model
        env:
          HF_HUB_OFFLINE: "0"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if uv run --frozen python -c "from evidenceflow.storage.embeddings import get_embedding; get_embedding('CI model readiness check')"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Model preparation failed (attempt $attempt/3). Waiting 300 seconds before retrying to respect upstream rate limits."
              sleep 300
            fi
          done
          echo "::error::Embedding model preparation failed after three attempts."
          exit 1

      - name: Validate cached embedding model offline
        run: uv run --frozen python -c "from evidenceflow.storage.embeddings import get_embedding, get_vector_dimension; assert len(get_embedding('CI offline model readiness check')) == get_vector_dimension()"

      - name: Save embedding model cache
        if: steps.fastembed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: ${{ steps.fastembed-cache.outputs.cache-primary-key }}

      - name: Index committed corpus in Qdrant
        run: uv run --frozen python -m evidenceflow.ingestion.index_qdrant

      - name: Initialize Neo4j memory schema
        run: uv run --frozen python -m evidenceflow.memory.init_neo4j

      - name: Record uncached development baseline (Gemini off)
        run: >-
          uv run --frozen python -m evidenceflow.eval.run_benchmark
          --split dev --no-gemini --repeats 3 --delay 0
          --output "${{ runner.temp }}/dev-baseline.json"

      - name: Upload development baseline
        uses: actions/upload-artifact@v4
        with:
          name: dev-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-baseline.json
          if-no-files-found: error

      - name: Run Full Test Suite
        run: uv run --frozen pytest tests -v

      - name: Execute CI Metric Regression Gate
        run: uv run --frozen python -m evidenceflow.eval.ci_gate
