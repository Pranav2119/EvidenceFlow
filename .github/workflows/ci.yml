name: EvidenceFlow AI - CI Quality & Regression Gate

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Test Suite & Metric Regression Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evidenceflow_db
          POSTGRES_USER: evidenceflow
          POSTGRES_PASSWORD: evidenceflow_dev_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -s -f http://localhost:6333/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.26.0-community
        env:
          NEO4J_AUTH: neo4j/evidenceflow_dev_secret
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p evidenceflow_dev_secret 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run PostgreSQL migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: evidenceflow_db
          POSTGRES_USER: evidenceflow
          POSTGRES_PASSWORD: evidenceflow_dev_secret
        run: uv run python -m evidenceflow.storage.migrate_postgres

      - name: Run Full Test Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: evidenceflow_db
          POSTGRES_USER: evidenceflow
          POSTGRES_PASSWORD: evidenceflow_dev_secret
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: evidenceflow_dev_secret
        run: uv run pytest tests/ -v

      - name: Execute CI Metric Regression Gate
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: evidenceflow_db
          POSTGRES_USER: evidenceflow
          POSTGRES_PASSWORD: evidenceflow_dev_secret
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: evidenceflow_dev_secret
        run: uv run python -m evidenceflow.eval.ci_gate
