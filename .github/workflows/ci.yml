name: EvidenceFlow AI - CI Quality & Regression Gate

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Test Suite & Metric Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      EMBEDDING_PROVIDER: fastembed
      GEMINI_API_KEY: ""
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: evidenceflow_db
      POSTGRES_USER: evidenceflow
      POSTGRES_PASSWORD: evidenceflow_dev_secret
      POSTGRES_APP_USER: evidenceflow_app
      POSTGRES_APP_PASSWORD: evidenceflow_app_secret
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: evidenceflow_dev_secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evidenceflow_db
          POSTGRES_USER: evidenceflow
          POSTGRES_PASSWORD: evidenceflow_dev_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceflow -d evidenceflow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.26.0-community
        env:
          NEO4J_AUTH: neo4j/evidenceflow_dev_secret
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p evidenceflow_dev_secret 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run PostgreSQL migrations
        run: uv run --frozen python -m evidenceflow.storage.migrate_postgres

      - name: Index committed corpus in Qdrant
        run: uv run --frozen python -m evidenceflow.ingestion.index_qdrant

      - name: Initialize Neo4j memory schema
        run: uv run --frozen python -m evidenceflow.memory.init_neo4j

      - name: Run Full Test Suite
        run: uv run --frozen pytest tests -v

      - name: Execute CI Metric Regression Gate
        run: uv run --frozen python -m evidenceflow.eval.ci_gate
