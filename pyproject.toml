[project]
name = "evidenceflow"
version = "0.1.0"
description = "Inspectable research-assistance platform with versioned RAG, graph memory, and evidence verification"
readme = "README.md"
authors = [
    { name = "Pranav", email = "pranavsakhalkar2119@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.0",
    "google-genai>=2.33.0",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=2.0.0",
    "mcp>=1.30.0,<2.0.0",
    "neo4j>=5.26.0,<6.0.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
evidenceflow = "evidenceflow:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
